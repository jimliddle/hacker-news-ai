<!doctype html>
<!--
  Undercurrent: a Hacker News reader that reads the mood of a thread before you do.
  Single file, no build step. Host it on any static host over HTTPS (or open it locally).

  Security notes
  - The Content-Security-Policy below only lets this page talk to the HN APIs and the three AI providers.
  - script-src is pinned to a sha256 hash of the inline script. If you edit the script, run `npm run pin`
    to update the hash in the meta tag, or the app won't run.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-XDP0hry3iYbHolkaNcb38sHCe4xXW2vAeBeW8ofZqes='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; manifest-src 'self' data: blob:; connect-src https://hacker-news.firebaseio.com https://hn.algolia.com https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#123840">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Undercurrent">
<meta name="application-name" content="Undercurrent">
<title>Undercurrent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column; each story is a ledger row with a tinted rank band on the left.
   In a thread, the mood card sits between the story and the first comment. */
:root{
  --bg:#e7edef; --surface:#fbfdfd; --sunk:#eef3f4; --band:#d0e0e3; --band-ink:#1d4850;
  --ink:#132228; --muted:#566b72; --read:#8a9ba1; --line:#d2dcdf;
  --bar:#123840; --bar-ink:#eef7f8; --bar-muted:#9cc0c6; --pri:#123840; --pri-ink:#eef7f8;
  --accent:#b35e17; --accent-soft:#f5e2cf;
  --pos:#2a8352; --neu:#788a90; --neg:#bc3d2c; --mix:#a07510; --focus:#24808f;
  --d1:#24808f; --d2:#b35e17; --d3:#6a5db3; --d4:#2a8352; --d5:#bc3d2c; --d6:#857428;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="bright"]){
    --bg:#0b1215; --surface:#131d21; --sunk:#0f181b; --band:#172a2f; --band-ink:#9fd1d9;
    --ink:#e1eaec; --muted:#8ca1a7; --read:#5d7177; --line:#223339;
    --bar:#0a1b20; --bar-ink:#e5f1f3; --bar-muted:#7ea6ad; --pri:#2a6d78; --pri-ink:#f1fafb;
    --accent:#ec9a4f; --accent-soft:#3a2616;
    --pos:#4dbd81; --neu:#8a9ba1; --neg:#f06d5a; --mix:#e1b347; --focus:#5bc3d3;
    --d1:#5bc3d3; --d2:#ec9a4f; --d3:#a497f0; --d4:#4dbd81; --d5:#f06d5a; --d6:#cdb860;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1215; --surface:#131d21; --sunk:#0f181b; --band:#172a2f; --band-ink:#9fd1d9;
  --ink:#e1eaec; --muted:#8ca1a7; --read:#5d7177; --line:#223339;
  --bar:#0a1b20; --bar-ink:#e5f1f3; --bar-muted:#7ea6ad; --pri:#2a6d78; --pri-ink:#f1fafb;
  --accent:#ec9a4f; --accent-soft:#3a2616;
  --pos:#4dbd81; --neu:#8a9ba1; --neg:#f06d5a; --mix:#e1b347; --focus:#5bc3d3;
  --d1:#5bc3d3; --d2:#ec9a4f; --d3:#a497f0; --d4:#4dbd81; --d5:#f06d5a; --d6:#cdb860;
  color-scheme:dark;
}
:root[data-theme="bright"]{
  --bg:#eef2f3; --surface:#ffffff; --sunk:#f3f6f7; --band:#e5f0f2; --band-ink:#1d5964;
  --ink:#10191d; --muted:#5a6d73; --read:#97a5aa; --line:#dce4e6;
  --bar:#ffffff; --bar-ink:#10191d; --bar-muted:#62767c; --pri:#1d5964; --pri-ink:#ffffff;
  --accent:#b35e17; --accent-soft:#fbe9d8;
  --pos:#2a8352; --neu:#788a90; --neg:#bc3d2c; --mix:#a07510; --focus:#1f7a89;
  --d1:#24808f; --d2:#b35e17; --d3:#6a5db3; --d4:#2a8352; --d5:#bc3d2c; --d6:#857428;
  color-scheme:light;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:calc(100% * var(--ts,1))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 .9375rem/1.5 var(--f-body);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100vh}
[hidden]{display:none!important}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:30}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);box-shadow:0 1px 0 var(--line)}
.hdr-in{max-width:52rem;margin:0 auto;display:flex;align-items:center;gap:2px;min-height:62px;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;flex:none;border:0;background:transparent;border-radius:50%;cursor:pointer;color:inherit;padding:0}
.icon-btn:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
.hd-titles{flex:1;min-width:0;padding:0 8px}
.hd-title{margin:0;font:700 1.22rem/1.15 var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-sub{font:400 .74rem/1.3 var(--f-mono);color:var(--bar-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-search{flex:1;min-width:0;display:flex;padding:0 6px}
.hd-input{flex:1;min-width:0;height:42px;border:0;border-radius:21px;padding:0 18px;background:color-mix(in srgb,var(--bar-ink) 13%,transparent);color:var(--bar-ink);font-size:max(16px,1rem)}
.hd-input::placeholder{color:var(--bar-muted)}

main{max-width:52rem;margin:0 auto;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* Story rows */
.list{display:flex;flex-direction:column;gap:6px;padding-block:6px 24px}
.row{display:grid;grid-template-columns:4.5rem minmax(0,1fr) auto 2.75rem;background:var(--surface);min-height:5.75rem}
.r-rank{background:var(--band);color:var(--band-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;padding:8px 2px}
.r-rank b{font:700 1.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.r-rank span{font:400 .76rem/1 var(--f-mono);opacity:.85;font-variant-numeric:tabular-nums}
.r-main{padding:12px 6px 12px 14px;min-width:0;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.r-title{font:700 1.04rem/1.32 var(--f-body);text-decoration:none;color:var(--ink);overflow-wrap:anywhere;align-self:flex-start}
.r-title:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.row.read .r-title{color:var(--read);font-weight:400}
.r-dom{font-style:italic;color:var(--muted);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-meta{color:var(--muted);font:400 .78rem/1.4 var(--f-mono);display:flex;align-items:center;gap:10px;min-width:0}
.r-when{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.r-mood{display:inline-flex;align-items:center;gap:5px;color:var(--c);font-weight:600;flex:none;white-space:nowrap}
.r-mood .dot{width:8px;height:8px}
.r-mood.pending{--c:var(--muted);font-weight:400}
.r-mood.pending .dot{animation:pulse .9s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.2}to{opacity:1}}
.moodwrap{display:grid;gap:2px}
.moodbar{display:flex;gap:6px;overflow-x:auto;padding:6px 10px 2px;scrollbar-width:none}
.moodbar::-webkit-scrollbar{display:none}
.moodbar .chip{height:32px;font-size:.8rem;flex:none;padding:0 12px}
.moodbar .chip .dot{width:8px;height:8px}
.moodnote{padding:0 14px;color:var(--muted);font:400 .74rem var(--f-mono);min-height:1em}
.moodnote:empty{display:none}
.r-cmt{align-self:end;display:flex;align-items:center;gap:5px;min-height:44px;padding:0 6px 6px;color:var(--accent);text-decoration:none;font:600 .92rem var(--f-mono);font-variant-numeric:tabular-nums}
.r-cmt .ic{width:20px;height:20px;fill:currentColor;stroke:none}
.r-cmt em{font-style:normal;font-size:.7rem;background:var(--accent);color:var(--surface);padding:1px 5px;border-radius:8px}
.r-more{align-self:end;margin-bottom:6px;color:var(--muted)}
.row.skel .r-rank b,.row.skel .r-rank span{display:block;background:color-mix(in srgb,var(--band-ink) 18%,transparent);border-radius:4px;width:24px;height:18px}
.row.skel .r-rank span{width:34px;height:10px}
.bone{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.more-wrap{display:flex;justify-content:center;padding:10px 0 20px}
.empty{padding:56px 24px;text-align:center;color:var(--muted);max-width:30rem;margin:0 auto}
.empty b{display:block;color:var(--ink);font:700 1.1rem var(--f-display);margin-bottom:6px}
.err{margin:16px;padding:18px;background:var(--surface);border-radius:12px;display:grid;gap:10px;justify-items:start}
.err b{font:700 1.05rem var(--f-display)}
.err p{margin:0;color:var(--muted)}

.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 4px}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.88rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}

/* Buttons */
.btn{height:42px;padding:0 16px;border-radius:9px;border:0;background:var(--pri);color:var(--pri-ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.arm{background:var(--neg);border-color:var(--neg);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn-text{border:0;background:none;color:var(--focus);font-weight:700;cursor:pointer;padding:6px 2px;font-size:.86rem}
.pillbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);text-decoration:none;cursor:pointer;font-size:.88rem;font-weight:700}
.pillbtn .ic{width:18px;height:18px}
.pillbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pillbtn.on .ic{fill:currentColor}

/* Thread */
.story{background:var(--surface);padding:18px 16px 16px}
.s-title{display:block;font:700 1.4rem/1.22 var(--f-display);letter-spacing:-.012em;text-decoration:none;text-wrap:balance;overflow-wrap:anywhere}
a.s-title:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.s-dom{display:inline-block;margin-top:6px;color:var(--accent);font-style:italic;text-decoration:none;overflow-wrap:anywhere}
.s-meta{margin-top:6px;color:var(--muted);font:400 .8rem/1.5 var(--f-mono)}
.s-text{margin-top:12px;overflow-wrap:anywhere}
.s-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* Mood card */
.ai{margin:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px}
.ai-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ai-label{display:inline-flex;gap:6px;align-items:center;font:600 .7rem var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-right:auto}
.ai-label .ic{width:16px;height:16px;color:var(--focus);fill:currentColor;stroke:none}
.pill{font:700 .78rem/1 var(--f-body);padding:6px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.v-positive,.s-positive{--c:var(--pos)} .v-negative,.s-negative{--c:var(--neg)} .v-mixed,.s-mixed{--c:var(--mix)} .v-neutral,.s-neutral{--c:var(--neu)}
.heat-calm{--c:var(--neu)} .heat-lively{--c:var(--mix)} .heat-heated{--c:var(--neg)}
.ai-score{font:600 .95rem var(--f-mono);font-variant-numeric:tabular-nums}
.ai-headline{font:700 1.2rem/1.3 var(--f-display);margin:12px 0 12px;text-wrap:balance}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--sunk)}
.split i{display:block;min-width:0}
.split .p{background:var(--pos)} .split .n{background:var(--neu)} .split .g{background:var(--neg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:400 .76rem var(--f-mono);color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.ai-summary{margin:14px 0 0;max-width:65ch}
.ai h4{font:600 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:16px 0 8px}
.themes{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.themes li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;align-items:baseline}
.themes b{font-weight:700}
.themes span{color:var(--muted)}
.reads{display:grid;gap:6px}
.read-link{display:grid;gap:2px;padding:10px 12px;border-radius:10px;background:var(--sunk);text-decoration:none}
.read-link:hover{background:color-mix(in srgb,var(--focus) 10%,var(--sunk))}
.read-link b{font:600 .82rem var(--f-mono);color:var(--focus)}
.read-link span{font-size:.92rem}
.ai-new{margin-top:14px;padding:9px 12px;border-radius:9px;background:var(--accent-soft);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.88rem}
.ai-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:14px;padding-top:8px;font:400 .72rem/1.4 var(--f-mono);color:var(--muted)}
.ai-prompt{display:grid;gap:10px;justify-items:start}
.ai-prompt h3{margin:4px 0 0;font:700 1.12rem/1.3 var(--f-display);text-wrap:balance}
.ai-prompt p{margin:0;color:var(--muted);max-width:60ch}
.ai-prompt .btns{display:flex;gap:8px;flex-wrap:wrap}
.ai.compact{padding:10px 14px;color:var(--muted);font-size:.9rem}
.ai-load{display:grid;gap:9px;margin-top:12px}
.ai-load p{margin:0 0 4px;color:var(--muted)}
.ai-err{color:var(--neg)}
.ai-actions{display:flex;gap:16px;flex-wrap:wrap}
.shared-note{display:flex;gap:9px;align-items:flex-start;margin:12px 0 0;padding:9px 12px;border-radius:9px;background:color-mix(in srgb,var(--focus) 11%,transparent);font-size:.86rem;line-height:1.45}
.shared-note .ic{width:16px;height:16px;flex:none;margin-top:2px;color:var(--focus)}
.shared-qa{display:grid;gap:10px}
.shared-qa .qa:last-child{border-bottom:0;padding-bottom:0}
.sheet.share-sheet{padding:14px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.share-hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.share-hd h2{margin:0;font:700 1.15rem var(--f-display)}
.share-hd .icon-btn{margin-right:-10px}
.share-preview{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:400 .84rem/1.5 var(--f-body);background:var(--sunk);border-radius:10px;padding:12px 14px;max-height:42vh;overflow-y:auto}
.share-note{margin:0;color:var(--muted);font-size:.84rem}
.share-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ask{margin:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:12px}
.ask-hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ask-hd h3{margin:0;font:700 1rem var(--f-display);display:inline-flex;align-items:center;gap:7px}
.ask-hd .ic{width:16px;height:16px;color:var(--focus);fill:currentColor;stroke:none}
.qa{display:grid;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.q{margin:0;font-weight:700;padding-left:10px;border-left:3px solid var(--focus)}
.a{max-width:65ch;overflow-wrap:anywhere}
.a p{margin:0 0 .55em}
.a ul{margin:0 0 .55em;padding-left:1.2em;display:grid;gap:4px}
.cite{font:600 .78em var(--f-mono);color:var(--focus);text-decoration:none;background:color-mix(in srgb,var(--focus) 12%,transparent);padding:1px 6px;border-radius:5px;white-space:nowrap}
.cite:hover{background:color-mix(in srgb,var(--focus) 22%,transparent)}
.qa-foot{font:400 .72rem var(--f-mono);color:var(--muted)}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg .chip{height:auto;min-height:34px;padding:6px 12px;font-weight:400;text-align:left;background:var(--sunk)}
.ask-form{display:flex;gap:8px}
.ask-form .txt{font-family:var(--f-body)}
.ask-note{margin:0;color:var(--muted);font-size:.8rem}

/* Comments */
.cm-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px}
.cm-bar h2{margin:0;font:700 1rem var(--f-display)}
.comments{display:flex;flex-direction:column;gap:6px;padding-bottom:48px}
.comments>.cm{background:var(--surface);padding:6px 6px 12px 14px}
.cm{--dc:var(--d1)}
.cm-head{display:flex;align-items:center;gap:2px;min-height:40px}
.cm-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;flex-wrap:wrap}
.cm-by{font:600 .84rem var(--f-mono);color:var(--dc);overflow-wrap:anywhere}
.op{font:700 .62rem/1 var(--f-mono);background:var(--accent);color:var(--surface);padding:3px 5px;border-radius:4px;letter-spacing:.04em}
.cm-when{color:var(--muted);font:400 .78rem var(--f-mono)}
.new{color:var(--accent);font:700 .66rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.cm-folded{display:none;color:var(--muted);font:400 .76rem var(--f-mono)}
.cm.collapsed>.cm-body,.cm.collapsed>.cm-kids{display:none}
.cm.collapsed>.cm-head .cm-folded{display:inline}
.cm.collapsed>.cm-head .cm-by{opacity:.75}
.cm-body{overflow-wrap:anywhere;line-height:1.55;padding-right:8px;border-radius:6px;transition:background-color .6s}
.cm-body p{margin:.6em 0 0}
.cm-body pre{overflow-x:auto;background:var(--sunk);padding:10px;border-radius:6px;font:400 .8rem/1.45 var(--f-mono);white-space:pre;margin:.6em 0 0}
.cm-body code{font-family:var(--f-mono);font-size:.88em}
.cm-body a,.s-text a{color:var(--focus);overflow-wrap:anywhere}
.cm-kids{margin-top:4px;padding-left:12px;border-left:2px solid color-mix(in srgb,var(--dc) 50%,transparent);display:flex;flex-direction:column;gap:2px}
.cm-kids.flat{padding-left:6px}
.cm-more{width:36px;height:36px;color:var(--muted)}
.cm.flash>.cm-body{background:var(--accent-soft)}
.muted{color:var(--muted)}

/* Saved comments */
.scard{background:var(--surface);padding:12px 16px 14px;display:grid;gap:6px}
.scard-meta{font:400 .78rem var(--f-mono);color:var(--muted)}
.scard-meta a{color:var(--ink);font-family:var(--f-body);font-weight:700;font-size:.9rem;text-decoration:none}
.scard .cm-body{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.scard-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Overlays */
.scrim{position:fixed;inset:0;background:rgba(4,14,17,.5);z-index:50;opacity:0;transition:opacity .18s}
.scrim.open{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:30rem;background:var(--surface);border-radius:18px 18px 0 0;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(16px);transition:transform .18s;max-height:85vh;overflow-y:auto}
.scrim.open .sheet{transform:none}
.sheet-title{padding:12px 20px 8px;font:700 .86rem/1.35 var(--f-body);color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sheet-item{display:flex;align-items:center;gap:16px;width:100%;padding:13px 20px;border:0;background:none;text-align:left;cursor:pointer;text-decoration:none;font-size:1rem;color:var(--ink)}
.sheet-item:hover{background:var(--sunk)}
.sheet-item .ic{color:var(--muted)}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(19rem,86vw);background:var(--surface);transform:translateX(-100%);transition:transform .2s;display:flex;flex-direction:column;overflow-y:auto}
.scrim.open .drawer{transform:none}
.drawer-head{background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--line);padding:calc(22px + env(safe-area-inset-top,0px)) 20px 18px max(20px,env(safe-area-inset-left,0px))}
.brand{font:800 1.55rem/1 var(--f-display);letter-spacing:-.02em}
.tag{color:var(--bar-muted);font-size:.84rem;margin-top:6px}
.nav{padding:8px 0;display:flex;flex-direction:column}
.nav a,.nav button{display:flex;gap:16px;align-items:center;padding:12px 20px;text-decoration:none;font-weight:700;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.nav a:hover,.nav button:hover{background:var(--sunk)}
.nav a.on{background:var(--band);color:var(--band-ink)}
.nav .ic{color:var(--muted)}
.nav a.on .ic{color:inherit}
.nav hr{border:0;border-top:1px solid var(--line);margin:8px 0}

.panel{position:absolute;top:0;bottom:0;right:0;width:100%;max-width:36rem;background:var(--bg);overflow-y:auto;transform:translateX(24px);transition:transform .2s;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.scrim.open .panel{transform:none}
.panel-hd{position:sticky;top:0;z-index:2;background:var(--bar);color:var(--bar-ink);box-shadow:0 1px 0 var(--line);display:flex;align-items:center;gap:4px;min-height:62px;padding:env(safe-area-inset-top,0px) 6px 0}
.panel-hd h2{margin:0 0 0 8px;font:700 1.22rem var(--f-display);flex:1}
.sec{background:var(--surface);margin-top:8px;padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.sec h3{margin:0;font:700 1.08rem var(--f-display)}
.sec>p{margin:0;color:var(--muted);font-size:.92rem;max-width:62ch}
.notice{background:var(--accent-soft);padding:10px 12px;border-radius:9px;font-size:.92rem}
.prov{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.prov.active{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.prov-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.prov-name{font:700 1.02rem var(--f-display)}
.prov-name small{font:400 .8rem var(--f-body);color:var(--muted);margin-left:6px}
.use{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;cursor:pointer}
.use input{width:18px;height:18px;accent-color:var(--focus);margin:0}
.badge{font:600 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--focus)}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font:400 .84rem var(--f-mono);color:var(--pos)}
.status.off{color:var(--muted)}
.key-row{display:flex;gap:8px}
.field{display:grid;gap:5px;min-width:0}
.field>span{font:600 .68rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.txt{height:42px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);color:var(--ink);padding:0 12px;font:400 max(16px,1rem) var(--f-mono);min-width:0;width:100%}
.ts-row{display:flex;align-items:center;gap:12px}
.ts-row input{flex:1;min-width:0;accent-color:var(--focus);height:28px}
.ts-a{font-family:var(--f-display);font-weight:700;color:var(--muted);line-height:1}
.ts-val{font:600 .86rem var(--f-mono);min-width:3.4em;text-align:right;font-variant-numeric:tabular-nums}
.app-row{display:flex;gap:14px;align-items:center}
.app-row img{width:56px;height:56px;border-radius:13px;flex:none}
.app-row div{min-width:0}
.app-row b{display:block;font:700 1rem var(--f-display)}
.app-row small{color:var(--muted)}
.steps{margin:0;padding-left:1.3em;display:grid;gap:4px}
.price-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.price-row .field>span{text-transform:none;letter-spacing:0;font-size:.74rem}
.spend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.spend div{background:var(--sunk);border-radius:10px;padding:10px 12px;min-width:0}
.spend b{display:block;font:600 1.15rem var(--f-mono);font-variant-numeric:tabular-nums}
.spend small{color:var(--muted);font-size:.76rem}
.txt:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 30%,transparent)}
.keylink{font-size:.84rem;color:var(--focus);font-weight:700}
.toggle{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.toggle input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--focus);flex:none}
.toggle small{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;align-self:start;justify-self:start}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:9px 16px;font-weight:700;font-size:.9rem}
.seg input:checked+span{background:var(--pri);color:var(--pri-ink)}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-3px}
.drow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.drow div{min-width:0}
.drow b{display:block}
.drow small{color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:90;max-width:calc(100% - 32px);font-weight:700;font-size:.92rem}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:720px){
  .list{gap:8px;padding-inline:16px;padding-top:12px}
  .row{border-radius:12px;overflow:hidden}
  .comments{padding-inline:12px}
  .comments>.cm{border-radius:12px}
  .story{margin:12px 12px 0;border-radius:14px;padding:22px 22px 18px}
  .ai,.ask{margin:10px 12px}
  .moodbar{padding-inline:16px}
  .moodnote{padding-inline:18px}
  .chips{padding-inline:16px}
  .scard{border-radius:12px;margin-inline:16px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const SVGNS = 'http://www.w3.org/2000/svg';
const FB = 'https://hacker-news.firebaseio.com/v0';
const ALG = 'https://hn.algolia.com/api/v1';
const PAGE = 30;
const FEEDS = {
  top:  { title: 'Top Stories', ep: 'topstories',  icon: 'trend' },
  new:  { title: 'New',         ep: 'newstories',  icon: 'clock' },
  best: { title: 'Best',        ep: 'beststories', icon: 'star' },
  ask:  { title: 'Ask HN',      ep: 'askstories',  icon: 'ask' },
  show: { title: 'Show HN',     ep: 'showstories', icon: 'show' },
  jobs: { title: 'Jobs',        ep: 'jobstories',  icon: 'jobs' },
};
const PROVIDERS = {
  claude: { name: 'Claude', vendor: 'Anthropic', placeholder: 'sk-ant-…', model: 'claude-sonnet-5-5',
            models: ['claude-sonnet-5-5', 'claude-haiku-5-5', 'claude-opus-5-5'], keyUrl: 'https://console.anthropic.com/settings/keys' },
  openai: { name: 'OpenAI', vendor: 'GPT models', placeholder: 'sk-…', model: 'gpt-5.6-luna',
            models: ['gpt-5.6-luna', 'gpt-5.4-nano', 'gpt-5.6-sol'], keyUrl: 'https://platform.openai.com/api-keys' },
  gemini: { name: 'Gemini', vendor: 'Google', placeholder: 'AIza…', model: 'gemini-3.6-flash',
            models: ['gemini-3.6-flash', 'gemini-3.1-pro-preview'], keyUrl: 'https://aistudio.google.com/apikey' },
};

/* ---------- tiny DOM helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'value') el.value = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false && k !== '') el.append(k.nodeType ? k : String(k));
  return el;
}
function fill(el, ...kids) {
  el.replaceChildren();
  for (const k of kids.flat(Infinity)) if (k != null && k !== false && k !== '') el.append(k.nodeType ? k : String(k));
  return el;
}
function icon(name, cls) {
  const s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('class', 'ic' + (cls ? ' ' + cls : ''));
  s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS(SVGNS, 'use');
  u.setAttribute('href', '#i-' + name);
  s.append(u);
  return s;
}
const iconBtn = (name, label, fn, cls) =>
  h('button', { class: 'icon-btn' + (cls ? ' ' + cls : ''), type: 'button', 'aria-label': label, title: label, onclick: fn }, icon(name));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const hnUrl = id => `https://news.ycombinator.com/item?id=${id}`;
function domain(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } }
function ago(t) {
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 60) return 'now';
  const m = s / 60; if (m < 60) return Math.floor(m) + 'm';
  const hr = m / 60; if (hr < 24) return Math.floor(hr) + 'h';
  const d = hr / 24; if (d < 30) return Math.floor(d) + 'd';
  if (d < 365) return Math.floor(d / 30) + 'mo';
  return Math.floor(d / 365) + 'y';
}
function agoWords(ms) {
  const s = (Date.now() - ms) / 1000;
  if (s < 45) return 'just now';
  const m = Math.round(s / 60); if (m < 60) return `${m} min ago`;
  const hr = Math.round(m / 60); if (hr < 24) return `${hr} h ago`;
  return new Date(ms).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;

/* ---------- preferences (non-secret) ---------- */
const PREF_KEY = 'uc.prefs';
const prefs = Object.assign({ theme: 'system', provider: null, models: {}, autorun: true, textScale: 1,
  monthlyCap: 5, prices: {}, prereadModels: {} },
  (() => { try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { return {}; } })());
prefs.preread = Object.assign({ on: false, count: 10, dailyCap: 0.5 }, prefs.preread);
function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {} }

/* ---------- storage: IndexedDB with in-memory fallback ---------- */
const DB_NAME = 'undercurrent';
const STORES = ['kv', 'secrets', 'saved', 'seen', 'analysis'];
const mem = Object.fromEntries(STORES.map(s => [s, new Map()]));
let dbPromise = null, memOnly = false;
function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open(DB_NAME, 1); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => { const d = r.result; STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); }); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
  }).catch(() => { memOnly = true; return null; });
  return dbPromise;
}
function idbReq(d, store, mode, fn) {
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode);
    const r = fn(t.objectStore(store));
    let out;
    r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('aborted'));
  });
}
const S = {
  async get(s, k)    { const d = await openDb(); return d ? idbReq(d, s, 'readonly', st => st.get(k)) : mem[s].get(k); },
  async put(s, k, v) { const d = await openDb(); return d ? idbReq(d, s, 'readwrite', st => st.put(v, k)) : void mem[s].set(k, v); },
  async del(s, k)    { const d = await openDb(); return d ? idbReq(d, s, 'readwrite', st => st.delete(k)) : void mem[s].delete(k); },
  async values(s)    { const d = await openDb(); return d ? idbReq(d, s, 'readonly', st => st.getAll()) : [...mem[s].values()]; },
  async keys(s)      { const d = await openDb(); return d ? idbReq(d, s, 'readonly', st => st.getAllKeys()) : [...mem[s].keys()]; },
  async count(s)     { const d = await openDb(); return d ? idbReq(d, s, 'readonly', st => st.count()) : mem[s].size; },
  async clear(s)     { const d = await openDb(); return d ? idbReq(d, s, 'readwrite', st => st.clear()) : void mem[s].clear(); },
};

/* ---------- secrets: AES-GCM with a non-extractable device key ---------- */
const te = new TextEncoder(), td = new TextDecoder();
const cryptoOK = !!(window.isSecureContext && window.crypto && crypto.subtle);
async function deviceKey() {
  let k = await S.get('kv', 'deviceKey');
  if (!k) {
    k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    await S.put('kv', 'deviceKey', k);
  }
  return k;
}
async function saveSecret(pid, value) {
  const key = await deviceKey();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: te.encode('uc:' + pid) }, key, te.encode(value));
  await S.put('secrets', pid, { iv, ct, hint: value.slice(-4), saved: Date.now() });
}
async function readSecret(pid) {
  const rec = await S.get('secrets', pid);
  if (!rec || !cryptoOK) return null;
  try {
    const key = await deviceKey();
    return td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: rec.iv, additionalData: te.encode('uc:' + pid) }, key, rec.ct));
  } catch { return null; }
}
async function savedProviders() {
  const ks = await S.keys('secrets').catch(() => []);
  return Object.keys(PROVIDERS).filter(p => ks.includes(p));
}
function activeProvider(saved) {
  if (!saved.length) return null;
  if (saved.length === 1) return saved[0];
  return saved.includes(prefs.provider) ? prefs.provider : null;
}

/* ---------- app state ---------- */
const listEl = $('#list'), threadEl = $('#thread'), hdrIn = $('#hdrIn'), toastEl = $('#toast');
const state = {
  view: null, listKey: null, listReady: false, listScroll: new Map(),
  ids: [], shown: 0, updated: 0, items: new Map(),

/* ---------- network ---------- */
async function getJSON(url, timeout = 15000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch(url, { signal: ctl.signal, credentials: 'omit', referrerPolicy: 'no-referrer' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('The request timed out.');
    if (e instanceof TypeError) throw new Error('Network request failed. Check your connection.');
    throw e;
  } finally { clearTimeout(t); }
}
async function getItem(id, fresh = false) {
  const c = state.items.get(id);
  if (c && !fresh && Date.now() - c.at < 120000) return c.v;
  const v = await getJSON(`${FB}/item/${id}.json`);
  if (v) state.items.set(id, { v, at: Date.now() });
  return v;
}
function limiter(n) {
  let active = 0; const q = [];
  const next = () => {
    if (active >= n || !q.length) return;
    active++;
    const { fn, res, rej } = q.shift();
    fn().then(res, rej).finally(() => { active--; next(); });
  };
  return fn => new Promise((res, rej) => { q.push({ fn, res, rej }); next(); });
}
function fromAlgolia(n, parent) {
  const node = { id: n.id, by: n.author, time: n.created_at_i, html: n.text, deleted: !n.author || n.text == null, kids: [], parent };
  for (const c of n.children || []) { const k = fromAlgolia(c, n.id); if (k) node.kids.push(k); }
  if (node.deleted && !node.kids.length) return null;
  return node;
}
async function algoliaTree(id) {
  const root = await getJSON(`${ALG}/items/${id}`, 20000);
  return (root.children || []).map(c => fromAlgolia(c, id)).filter(Boolean);
}
async function firebaseTree(story) {
  let budget = 1500;
  const q = limiter(12);
  async function load(id, parent) {
    if (budget-- <= 0) return null;
    const it = await q(() => getJSON(`${FB}/item/${id}.json`)).catch(() => null);
    if (!it || it.dead) return null;
    const node = { id: it.id, by: it.by, time: it.time, html: it.text, deleted: !!it.deleted, kids: [], parent };
    node.kids = (await Promise.all((it.kids || []).map(k => load(k, it.id)))).filter(Boolean);
    if (node.deleted && !node.kids.length) return null;
    return node;
  }
  return (await Promise.all((story.kids || []).map(k => load(k, story.id)))).filter(Boolean);
}
function countTree(list) { let n = 0; for (const c of list) { if (!c.deleted) n++; n += countTree(c.kids); } return n; }

/* ---------- HTML sanitizer for HN comment markup ---------- */
const ALLOWED = new Set(['P', 'A', 'I', 'EM', 'B', 'STRONG', 'CODE', 'PRE', 'BR', 'U']);
function safeHref(href) {
  if (!href) return null;
  let u;
  try { u = new URL(href, 'https://news.ycombinator.com/'); } catch { return null; }
  if (!/^https?:$/.test(u.protocol)) return null;
  const id = u.searchParams.get('id');
  if (u.hostname === 'news.ycombinator.com' && u.pathname === '/item' && /^\d+$/.test(id || '')) return { href: '#/hn/' + id, internal: true };
  return { href: u.href };
}
function sanitize(html) {
  const doc = new DOMParser().parseFromString(`<body>${html || ''}</body>`, 'text/html');
  const frag = document.createDocumentFragment();
  (function walk(src, dst) {
    for (const n of src.childNodes) {
      if (n.nodeType === 3) dst.append(n.textContent);
      else if (n.nodeType === 1) {
        if (!ALLOWED.has(n.tagName)) { walk(n, dst); continue; }
        const el = document.createElement(n.tagName.toLowerCase());
        if (n.tagName === 'A') {
          const l = safeHref(n.getAttribute('href'));
          if (!l) { walk(n, dst); continue; }
          el.href = l.href;
          if (!l.internal) { el.target = '_blank'; el.rel = 'noopener noreferrer nofollow'; }
        }
        walk(n, el);
        dst.append(el);
      }
    }
  })(doc.body, frag);
  return frag;
}
function plain(html) {
  if (!html) return '';
  const d = new DOMParser().parseFromString(html, 'text/html');
  d.querySelectorAll('p').forEach(p => p.prepend(' '));
  return d.body.textContent.replace(/\s+/g, ' ').trim();
}

const SYSTEM_PROMPT = `You analyse the sentiment of Hacker News comment threads.

  "score": integer from -100 (overwhelmingly negative) to 100 (overwhelmingly positive),
  "heat": "calm" | "lively" | "heated",
  "headline": "one sentence under 20 words capturing the overall mood",
  "summary": "two or three sentences on what people think and why",
  "split": { "positive": integer percent, "neutral": integer percent, "negative": integer percent },
  "themes": [ { "label": "short noun phrase", "sentiment": "positive" | "mixed" | "negative" | "neutral", "detail": "one sentence" } ],
  "standouts": [ { "id": the numeric comment id from the transcript, "why": "one short sentence on why it is worth reading" } ]

function buildTranscript(story, kids, budget = 90000) {
  const flat = [];
  (function walk(list, depth) {
    for (const n of list) {
      if (!n.deleted && n.html) flat.push({ n, depth, i: flat.length });
      walk(n.kids, depth + 1);
    }
  })(kids, 0);
  for (const f of flat) {
    let t = plain(f.n.html);
    if (t.length > 1200) t = t.slice(0, 1200) + '…';
    f.line = `${'  '.repeat(Math.min(f.depth, 8))}[${f.n.id}] ${f.n.by}${f.n.by === story.by ? ' (OP)' : ''}: ${t}`;
  }
  const byPriority = [...flat].sort((a, b) => a.depth - b.depth || a.i - b.i);
  const pick = new Set(); let used = 0;
  for (const f of byPriority) { if (used + f.line.length + 1 > budget) continue; used += f.line.length + 1; pick.add(f.i); }
  return { text: flat.filter(f => pick.has(f.i)).map(f => f.line).join('\n'), analysed: pick.size, total: flat.length };
}

    '',

}
async function postJSON(url, headers, body, signal, pname) {

  }
  const j = await r.json().catch(() => null);
  if (!r.ok) {

    const keyish = r.status === 401 || r.status === 403 || (r.status === 400 && /api key|apikey|credential/i.test(m));
    const hint = keyish ? ` Check your ${pname} key in Settings.`

    const j = await postJSON('https://api.anthropic.com/v1/messages', {

    }, { model, max_tokens: maxTokens, system: sys, messages }, signal, pname);

  const note = wrap?.querySelector('.moodnote');
  if (note) note.textContent = moodFilterOn()

}

/* ---------- analyze one story from its menu ---------- */
async function analyzeFromList(it) {
  if (state.inflight.has(it.id)) { toast('Already reading this thread'); return; }
  const saved = await savedProviders();
  if (!saved.length) { toast('Add an API key to read thread moods'); openSettings(); return; }
  const pid = activeProvider(saved);
  if (!pid) {
    openSheet('Which provider should read this thread?', saved.map(p => ({ icon: 'spark', label: `Use ${PROVIDERS[p].name}`,
      run: () => { prefs.provider = p; savePrefs(); analyzeFromList(it); } })));
    return;
  }
  // Show progress straight away; the comment fetch can take a second on big threads.
  const hold = { p: new Promise(() => {}), meta: { pid, model: mainModel(pid), n: it.descendants || 0, ctl: new AbortController(), kind: 'manual' } };
  state.inflight.set(it.id, hold); rowsChip(it.id);
  let kids = null, fetchErr = null;
  try {
    try { kids = await algoliaTree(it.id); }
    catch { const full = await getItem(it.id, true); kids = full ? await firebaseTree(full) : []; }
  } catch (e) { fetchErr = e; }
  state.inflight.delete(it.id); rowsChip(it.id);
  if (!kids) { toast(`Couldn't load the comments. ${fetchErr?.message || ''}`.trim()); return; }
  const tr = buildTranscript(it, kids);
  if (!tr.analysed) { toast('This thread has no comments to read yet'); return; }
  try {
    const rec = await analyzeStory(it, tr, pid, mainModel(pid), 'manual').p;
    const r = rec.result;
    toast(`Mood: ${cap(r.verdict)} ${(r.score > 0 ? '+' : '') + r.score}${rec.cost != null ? ' · ' + money(rec.cost) : ''}`);
  } catch (e) {
    if (e.name !== 'AbortError') toast(e.message);
  }
}

/* ---------- pre-read: analyze the top of a feed in the background ---------- */
let prereadRun = 0;
function prereadStatus(msg) {
  state.prereadMsg = msg;
  const el = $('#hdSub');
  if (el && state.view === 'list' && state.listKey?.startsWith('feed:')) el.textContent = msg || feedSub();
}
async function prereadFeed() {
  const run = ++prereadRun;
  if (!prefs.preread.on) return prereadStatus(null);
  const pid = activeProvider(await savedProviders());
  if (!pid) return prereadStatus(null);
  const model = prereadModel(pid);
  const todo = state.ids.slice(0, prefs.preread.count).filter(id => !state.moods.has(id));
  let i = 0;
  for (const id of todo) {
    i++;
    if (run !== prereadRun) return;
    if (state.inflight.has(id) || state.moods.has(id)) continue;
    const story = await getItem(id).catch(() => null);
    if (!story || story.type !== 'story' || (story.descendants || 0) < 5) continue;
    let kids;
    try { kids = await algoliaTree(id); } catch { continue; }
    if (run !== prereadRun) return;
    if (state.inflight.has(id) || state.moods.has(id)) continue;
    const tr = buildTranscript(story, kids);
    if (!tr.analysed) continue;
    const est = estimate(model, analysisChars(story, tr));
    if (est.cost == null) return prereadStatus(`Pre-read paused: add prices for ${model} in Settings`);
    const l = await ledger();
    if (l.dayPreread + est.cost > prefs.preread.dailyCap) return prereadStatus(`Pre-read paused: today's ${money(prefs.preread.dailyCap)} budget is used`);
    if (overMonthly(l, est.cost)) return prereadStatus('Pre-read paused: monthly limit reached');
    prereadStatus(`Pre-reading ${i} of ${todo.length}…`);
    try { await analyzeStory(story, tr, pid, model, 'preread').p; }
    catch (e) {
      if (run === prereadRun) prereadStatus(null);
      if (e.name !== 'AbortError') toast(`Pre-read stopped. ${e.message}`);
      return;
    }
  }
  if (run === prereadRun) prereadStatus(null);
}

/* ---------- ask this thread ---------- */
const ASK_SYSTEM = `You answer questions about one Hacker News discussion, using only the comments provided below.
Cite the comments you draw on by putting their numeric id in square brackets, like [41234567]. Cite specific comments rather than the thread in general.
If the comments don't answer the question, say so plainly instead of guessing.
Keep answers short: two to five sentences, or a short list where each line starts with "- ". Use plain text, with no headings, bold or tables.`;
const SUGGESTIONS = ['What are the main objections?', 'Did anyone with hands-on experience weigh in?', 'What alternatives do people suggest?'];
async function setupAsk(section, story) {
  const pid = activeProvider(await savedProviders());
  if (!section.isConnected) return;
  if (!pid || !state.thread?.total) { section.hidden = true; return; }
  section.hidden = false;
  const hist = (await S.get('kv', 'qa:' + story.id).catch(() => null)) || [];
  if (section.isConnected) renderAsk(section, story, pid, hist);
}
function renderAnswer(text, story) {
  const frag = document.createDocumentFragment();
  const inline = (el, str) => {
    str = str.replace(/\*\*(.+?)\*\*/g, '$1');
    for (const part of str.split(/(\[\d{3,}(?:\s*,\s*\d{3,})*\])/)) {
      const m = part.match(/^\[([\d,\s]+)\]$/);
      if (!m) { if (part) el.append(part); continue; }
      m[1].split(',').map(x => +x.trim()).forEach(id => {
        const node = state.thread?.id === story.id ? state.thread.nodes.get(id)?.n : null;
        el.append(node ? h('a', { class: 'cite', href: `#/item/${story.id}/${id}`, title: `Jump to ${node.by}'s comment` }, node.by) : `[${id}]`, ' ');
      });
    }
  };
  for (const block of text.trim().split(/\n\s*\n/)) {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) continue;
    if (lines.every(l => /^[-*•]\s+/.test(l))) {
      const ul = h('ul');
      lines.forEach(l => { const li = h('li'); inline(li, l.replace(/^[-*•]\s+/, '')); ul.append(li); });
      frag.append(ul);
    } else {
      lines.forEach(l => { const p = h('p'); inline(p, l.replace(/^#+\s*/, '')); frag.append(p); });
    }
  }
  return frag;
}
function renderAsk(section, story, pid, hist, pending) {
  const model = mainModel(pid);
  const input = h('input', { class: 'txt', id: 'askInput', type: 'text', maxlength: '500', placeholder: 'Ask about this thread', autocomplete: 'off', enterkeyhint: 'send', 'aria-label': 'Ask a question about this thread', disabled: !!pending });
  const est = estimate(model, ASK_SYSTEM.length + userPrompt(story, threadTranscript()).length, 'ask');
  const ask = async q => {
    if (pending) return;
    renderAsk(section, story, pid, hist, q);
    try {
      const a = await askThread(story, pid, hist, q);
      hist = [...hist, a];
      await S.put('kv', 'qa:' + story.id, hist).catch(() => {});
      if (section.isConnected) renderAsk(section, story, pid, hist);
    } catch (e) {
      if (!section.isConnected) return;
      renderAsk(section, story, pid, hist);
      section.querySelector('.ask-form').before(h('p', { class: 'ai-err', role: 'alert', text: e.message }));
      section.querySelector('#askInput').value = q;

  fill(section,
    h('div', { class: 'ask-hd' },
      h('h3', null, icon('spark'), 'Ask this thread'),
      hist.length > 0 && !pending && h('button', { class: 'btn-text', type: 'button', onclick: async () => {
        await S.del('kv', 'qa:' + story.id).catch(() => {}); renderAsk(section, story, pid, []);
      } }, 'Clear')),
    hist.map(x => h('div', { class: 'qa' },
      h('p', { class: 'q', text: x.q }),
      h('div', { class: 'a' }, renderAnswer(x.a, story)),
      h('div', { class: 'qa-foot', text: [PROVIDERS[x.provider]?.name, x.model, x.cost != null ? money(x.cost) : null, agoWords(x.at)].filter(Boolean).join(' · ') }))),
    pending && h('div', { class: 'qa', 'aria-busy': 'true' }, h('p', { class: 'q', text: pending }),
      h('div', { class: 'ai-load' }, h('span', { class: 'bone', style: 'width:92%' }), h('span', { class: 'bone', style: 'width:76%' }))),
    !hist.length && !pending && h('div', { class: 'sugg' }, SUGGESTIONS.map(s => h('button', { class: 'chip', type: 'button', onclick: () => ask(s) }, s))),
    h('form', { class: 'ask-form', onsubmit: e => { e.preventDefault(); const q = input.value.trim(); if (q) ask(q); } },
      input, h('button', { class: 'btn', type: 'submit', disabled: !!pending }, pending ? 'Asking…' : 'Ask')),
    h('p', { class: 'ask-note', text: `Answered by ${PROVIDERS[pid].name} (${model}) from this thread's comments only. ${est.cost != null ? `Roughly ${money(est.cost)} per question` : `About ${fmtTok(est.tokens)} tokens per question`}${pid === 'claude' ? ', less for follow-ups' : ''}.` }));

async function askThread(story, pid, hist, q) {
  const model = mainModel(pid);
  const key = await readSecret(pid);
  if (!key) throw new Error(`Your ${PROVIDERS[pid].name} key couldn't be read. Save it again in Settings.`);
  const cacheText = userPrompt(story, threadTranscript());
  const messages = [];
  for (const x of hist.slice(-5)) messages.push({ role: 'user', content: x.q }, { role: 'assistant', content: x.a });
  messages.push({ role: 'user', content: q });
  const { text, usage } = await callLLM(pid, key, model, { system: ASK_SYSTEM, cacheText, messages, maxTokens: 1200 });
  const cost = costOf(model, usage);
  await recordSpend(cost, 'ask');
  if (!text.trim()) throw new Error(`${PROVIDERS[pid].name} returned an empty answer. Try again or rephrase.`);
  return { q, a: text.trim(), at: Date.now(), provider: pid, model, cost };

      h('div', { class: 'field' }, h('span', { text: rec ? 'Replace key' : 'API key' }),
        h('div', { class: 'key-row' }, keyInput, h('button', { class: 'btn', type: 'button', disabled: !cryptoOK, onclick: save }, 'Save'))),
      h('label', { class: 'field', for: modelId }, h('span', { text: 'Model' }),
        h('input', { class: 'txt', id: modelId, list: `${modelId}-list`, value: prefs.models[pid] || P.model, autocomplete: 'off', spellcheck: 'false', onchange: e => {
          const v = e.target.value.trim(); if (v && v !== P.model) prefs.models[pid] = v; else delete prefs.models[pid]; savePrefs(); render();
        } }),
        h('datalist', { id: `${modelId}-list` }, P.models.map(m => h('option', { value: m })))),
      priceFields(mainModel(pid), `price-${pid}`),
      h('a', { class: 'keylink', href: P.keyUrl, target: '_blank', rel: 'noopener noreferrer' }, `Get a ${P.name} key`));
  }
  render().then(() => { if (focusId) panel.querySelector('#' + focusId)?.scrollIntoView({ block: 'start' }); });
}

/* ---------- theme ---------- */
function applyTheme() {
  const r = document.documentElement;
  if (['light', 'bright', 'dark'].includes(prefs.theme)) r.dataset.theme = prefs.theme; else delete r.dataset.theme;
  const bar = getComputedStyle(r).getPropertyValue('--bar').trim();
  if (bar) document.querySelector('meta[name="theme-color"]').setAttribute('content', bar);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

/* ---------- text size ---------- */
const TS_MIN = 0.85, TS_MAX = 1.5;
function applyTextScale() {
  prefs.textScale = clamp(Math.round((+prefs.textScale || 1) * 100) / 100, TS_MIN, TS_MAX);
  document.documentElement.style.setProperty('--ts', prefs.textScale);
}
function stepText(dir) {
  prefs.textScale = clamp((+prefs.textScale || 1) + dir * 0.1, TS_MIN, TS_MAX);
  applyTextScale(); savePrefs();
  toast(`Text size ${Math.round(prefs.textScale * 100)}%`);
}
function textSizeControl() {
  const pct = () => Math.round(prefs.textScale * 100) + '%';
  const val = h('span', { class: 'ts-val', text: pct() });
  const range = h('input', { type: 'range', id: 'textScale', min: TS_MIN * 100, max: TS_MAX * 100, step: 5, value: String(Math.round(prefs.textScale * 100)), 'aria-label': 'Text size', 'aria-valuetext': pct(),
    oninput: e => { prefs.textScale = +e.target.value / 100; applyTextScale(); val.textContent = pct(); range.setAttribute('aria-valuetext', pct()); },
    onchange: savePrefs });
  return h('div', { class: 'field' }, h('span', { text: 'Text size' }),
    h('div', { class: 'ts-row' }, h('span', { class: 'ts-a', style: 'font-size:.8rem', 'aria-hidden': 'true' }, 'A'), range, h('span', { class: 'ts-a', style: 'font-size:1.35rem', 'aria-hidden': 'true' }, 'A'), val),
    h('button', { class: 'btn-text', type: 'button', style: 'justify-self:start', onclick: () => {
      prefs.textScale = 1; applyTextScale(); savePrefs(); range.value = '100'; val.textContent = pct();
    } }, 'Reset to default'));
}
const textItems = () => [
  { icon: 'textup', label: 'Larger text', run: () => stepText(1) },
  { icon: 'textdown', label: 'Smaller text', run: () => stepText(-1) },
];

/* ---------- install as an app (manifest and icons generated in-page) ---------- */
const ICON_BG = '#123840';
function drawIcon(size, fullBleed) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  if (!x) return '';
  const k = size / 512;
  x.fillStyle = ICON_BG;
  if (fullBleed || !x.roundRect) x.fillRect(0, 0, size, size);
  else { x.beginPath(); x.roundRect(0, 0, size, size, 112 * k); x.fill(); }
  // Three currents, the lowest one in copper. Kept inside the maskable safe zone.
  const waves = [{ y: 190, c: '#7ea6ad', w: 26 }, { y: 256, c: '#eef7f8', w: 30 }, { y: 322, c: '#ec9a4f', w: 34 }];
  x.lineCap = 'round'; x.lineJoin = 'round';
  for (const wv of waves) {
    x.strokeStyle = wv.c; x.lineWidth = wv.w * k; x.beginPath();
    for (let i = 0; i <= 64; i++) {
      const px = 128 + i * 4, py = wv.y + Math.sin(i / 64 * Math.PI * 2) * 26;
      i ? x.lineTo(px * k, py * k) : x.moveTo(px * k, py * k);
    }
    x.stroke();
  }
  try { return c.toDataURL('image/png'); } catch { return ''; }
}
const pwa = { evt: null, icon: '' };
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function setupPwa() {
  const addLink = (rel, href, extra) => { if (!href) return; const l = h('link', { rel, href, ...extra }); document.head.append(l); };
  const i192 = drawIcon(192), i512 = drawIcon(512), m512 = drawIcon(512, true);
  pwa.icon = i192;
  addLink('icon', drawIcon(64), { type: 'image/png' });
  addLink('apple-touch-icon', drawIcon(180, true));
  if (!/^https?:$/.test(location.protocol) || !i512) return;
  const base = location.href.split('#')[0];
  const manifest = {
    id: base, name: 'Undercurrent', short_name: 'Undercurrent',
    description: 'Hacker News, with the mood of each thread read first.',
    start_url: base + '#/top', scope: new URL('./', base).href,
    display: 'standalone', orientation: 'any',
    background_color: '#e7edef', theme_color: ICON_BG,
    icons: [
      { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: m512, sizes: '512x512', type: 'image/png', purpose: 'maskable' },
    ],
    shortcuts: [
      { name: 'Top Stories', url: base + '#/top' },
      { name: 'Saved', url: base + '#/saved' },
    ],
  };
  addLink('manifest', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest)));
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pwa.evt = e; });
window.addEventListener('appinstalled', () => { pwa.evt = null; toast('Undercurrent installed'); });
async function promptInstall() {
  if (!pwa.evt) return false;
  const e = pwa.evt; pwa.evt = null;
  e.prompt();
  try { const { outcome } = await e.userChoice; if (outcome === 'dismissed') toast('Install cancelled'); } catch {}
  return true;
}
function canOfferInstall() { return !isStandalone() && (!!pwa.evt || isIOS); }
function installBlock(rerender) {
  const head = h('div', { class: 'app-row' },
    pwa.icon && h('img', { src: pwa.icon, alt: '' }),
    h('div', null, h('b', { text: 'Undercurrent' }), h('small', { text: 'Opens in its own window, with an icon on your home screen or dock.' })));
  let body;
  if (isStandalone()) body = h('p', { text: 'You’re using the installed app.' });
  else if (!/^https?:$/.test(location.protocol)) body = h('p', { text: 'Open this page from a web address (HTTPS) to install it. Browsers can’t install apps from a local file.' });
  else if (pwa.evt) body = h('button', { class: 'btn', type: 'button', onclick: async () => { await promptInstall(); rerender?.(); } }, 'Install app');
  else if (isIOS) body = h('ol', { class: 'steps' }, h('li', { text: 'Open this page in Safari.' }), h('li', { text: 'Tap the Share button.' }), h('li', { text: 'Choose Add to Home Screen, then Add.' }));
  else body = h('p', { text: 'Use your browser’s menu and choose Install app or Add to Home screen. Chrome and Edge also show an install icon at the right of the address bar. Firefox on desktop can’t install web apps.' });
  return [head, body];
}

/* ---------- router ---------- */
function route() {
  document.querySelectorAll('.scrim').forEach(s => s.close?.());
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  const [a = '', b, c] = parts;
  if (a === 'item' && /^\d+$/.test(b || '')) {
    if (c === 's' && parts[3]) return openShared(+b, parts[3]);
    return showThread(+b, /^\d+$/.test(c || '') ? +c : null);
  }
  if (a === 'hn' && /^\d+$/.test(b || '')) return resolveHn(+b);
  if (a === 'saved') return showSaved(b === 'comments' ? 'comments' : 'stories');
  if (a === 'search') { let q = ''; try { q = decodeURIComponent(parts.slice(1).join('/')); } catch {} return showSearch(q); }
  return showFeed(FEEDS[a] ? a : 'top');
}
window.addEventListener('hashchange', () => { state.navCount++; route(); });

/* ---------- boot ---------- */
(async function init() {
  applyTheme();
  applyTextScale();
  try { setupPwa(); } catch {}
  await openDb();
  const [seen, saved] = await Promise.all([S.values('seen').catch(() => []), S.values('saved').catch(() => [])]);
  seen.forEach(r => r && state.seen.set(r.id, r));
  (await S.values('analysis').catch(() => [])).forEach(r => { if (r?.result) state.moods.set(r.id, { verdict: r.result.verdict, score: r.result.score, heat: r.result.heat, kind: r.kind }); });
  await ledger();
  saved.forEach(r => r && state.saved.set(r.key, r));
  pruneSeen();
  route();
})();
})();
</script>
